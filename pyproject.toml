[project]
name = "15-minute-bot"
version = "0.1.0"
description = "Local dashboard that trades Public.com 15-minute prediction markets with per-market rules"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "publicdotcom-py>=0.1.27",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
