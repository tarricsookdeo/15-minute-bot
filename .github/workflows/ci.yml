# The tests, on every pull request. Other workflows can run it too (workflow_call).
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A real Postgres for tests/test_postgres.py (saved sessions and the takeover lock).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
      - name: Install dependencies (exactly as locked)
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest -q
      - name: Check dashboard JavaScript
        run: node --check fifteen_bot/static/app.js
